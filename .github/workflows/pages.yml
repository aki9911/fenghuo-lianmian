name: Build playable demo and deploy Pages
on:
  push:
    branches: [main]
    paths: ['game/**', 'web/**', 'tools/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot and templates
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          python3 tools/fetch_export_templates.py
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp .runtime/roaming/Godot/export_templates/4.7.2.stable/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Import and check core rules
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --editor --import --quit
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/test_economy.gd
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/test_battle.gd
      - name: Build current browser version
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --export-release Web "$GITHUB_WORKSPACE/web/game.html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
